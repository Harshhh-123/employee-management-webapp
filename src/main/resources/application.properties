# PostgreSQL - Supabase
spring.datasource.url=jdbc:postgresql://db.gxumrwjerzqcoogubpxb.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=Harsh@8200391303
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

# Server
server.port=8081

# Redis
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms
spring.cache.type=redis

# HikariCP - Connection Pool for Supabase
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:8081

# Pagination
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100